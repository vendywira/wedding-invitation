<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 684" fill="none">
  <defs>
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Flower petals -->
  <ellipse cx="297" cy="200" rx="80" ry="120" fill="url(#flowerGrad)" opacity="0.8"/>
  <ellipse cx="200" cy="280" rx="70" ry="100" fill="url(#flowerGrad)" opacity="0.7" transform="rotate(-30 200 280)"/>
  <ellipse cx="394" cy="280" rx="70" ry="100" fill="url(#flowerGrad)" opacity="0.7" transform="rotate(30 394 280)"/>
  <ellipse cx="220" cy="380" rx="60" ry="90" fill="url(#flowerGrad)" opacity="0.6" transform="rotate(-45 220 380)"/>
  <ellipse cx="374" cy="380" rx="60" ry="90" fill="url(#flowerGrad)" opacity="0.6" transform="rotate(45 374 380)"/>
  <!-- Center -->
  <circle cx="297" cy="300" r="40" fill="#FFF1D4"/>
  <!-- Leaves -->
  <ellipse cx="150" cy="450" rx="40" ry="80" fill="#4a7c59" opacity="0.6" transform="rotate(-60 150 450)"/>
  <ellipse cx="444" cy="450" rx="40" ry="80" fill="#4a7c59" opacity="0.6" transform="rotate(60 444 450)"/>
</svg>
