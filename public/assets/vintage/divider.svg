      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFF1D4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:0.3" />
