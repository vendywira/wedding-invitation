  <!-- Right flowers -->
  <circle cx="680" cy="156" r="15" fill="#d4a853" opacity="0.7"/>
  <circle cx="820" cy="156" r="12" fill="#d4a853" opacity="0.5"/>
  <circle cx="960" cy="156" r="10" fill="#d4a853" opacity="0.3"/>
  <!-- Leaves -->
  <ellipse cx="350" cy="146" rx="20" ry="8" fill="#4a7c59" opacity="0.5" transform="rotate(-20 350 146)"/>
  <ellipse cx="730" cy="146" rx="20" ry="8" fill="#4a7c59" opacity="0.5" transform="rotate(20 730 146)"/>
