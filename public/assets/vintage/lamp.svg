<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 430" fill="none">
  <defs>
    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF1D4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFF1D4;stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- Chain -->
  <line x1="181" y1="0" x2="181" y2="80" stroke="#d4a853" stroke-width="3"/>
  <!-- Lamp top -->
  <ellipse cx="181" cy="90" rx="40" ry="15" fill="url(#lampGrad)"/>
  <!-- Lamp body -->
  <path d="M141,90 Q100,200 120,350 Q140,400 181,420 Q222,400 242,350 Q262,200 221,90 Z" fill="url(#lampGrad)" opacity="0.9"/>
  <!-- Light glow -->
  <ellipse cx="181" cy="250" rx="100" ry="150" fill="url(#lightGlow)"/>
  <!-- Decorative rings -->
  <ellipse cx="181" cy="150" rx="35" ry="10" fill="none" stroke="#FFF1D4" stroke-width="2" opacity="0.6"/>
  <ellipse cx="181" cy="250" rx="50" ry="12" fill="none" stroke="#FFF1D4" stroke-width="2" opacity="0.6"/>
  <ellipse cx="181" cy="350" rx="35" ry="10" fill="none" stroke="#FFF1D4" stroke-width="2" opacity="0.6"/>
</svg>
